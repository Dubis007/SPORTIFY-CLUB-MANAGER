# Integración continua: construye y prueba backend y frontend en cada push y pull request
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET) - build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore backend/Sportify.slnx

      - name: Compilar
        run: dotnet build backend/Sportify.slnx --no-restore -c Release

      - name: Pruebas unitarias con cobertura
        run: >
          dotnet test backend/Sportify.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory backend/TestResults
          --logger trx

      - name: Publicar resultados y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (React) - lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pruebas unitarias con cobertura (Vitest)
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker - validar imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construir imágenes con docker compose
        run: |
          cp .env.example .env
          docker compose build
